services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pocp
      POSTGRES_PASSWORD: pocp
      POSTGRES_DB: pocp
    ports:
      # Host port 5435 (5432–5434 often taken on Windows dev machines)
      - "5435:5432"
    volumes:
      - pocp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocp -d pocp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      # 8000 is often taken by other local stacks (e.g. ai-sfoms-factory); use 8008 for PoCP.
      - "8008:8000"
    # No --reload: volume-mounted source changes were trapping startup in a reload loop.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://pocp:pocp@postgres:5432/pocp
      POCP_WAIT_FOR_DB: "true"
      POCP_WAIT_FOR_DB_SECONDS: "60"
      ENABLE_DEV_LOGIN: "true"
      ENABLE_MOCK_VERIFIER: "true"
      BACKEND_URL: "http://localhost:8008"
      POCP_REPO_ROOT: "/workspace"
      # Cursor/super-loop run on Windows host — not inside this container (avoids bridge errors).
      POCP_NEXUS_SUPER_LOOP_HOST: "true"
      POCP_NEXUS_SUPER_LOOP: "false"
      POCP_NEXUS_AUTOPILOT: "true"
      POCP_CURSOR_AUTOMATION: "true"
      POCP_STUDIO_AUTO_EVOLVE: "true"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8008
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pocp_pg_data:
