services:
  backend:
    build:
      context: ./backend
      target: ${POCP_ENV:-development}
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - POCP_ENV=${POCP_ENV:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - ./backend:/app
      - pocp_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pocp_data:
    driver: local
