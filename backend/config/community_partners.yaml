      - capability: evidence_provenance
        label: Creation-mode and expert-citation envelopes
    capabilities_sought:
      - capability: witness
        label: Cross-protocol verification claims
    outreach:
      channel: github
      contact_url: https://github.com/openoctp/spec/issues
      next_action: Propose pocp.provenance octp-compatible-v0.2 extensions

  agentskills:
