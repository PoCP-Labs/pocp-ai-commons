# Community partner outreach — active discovery in OSS & distributed communities.
# Each partner is a community Entity with offered/sought capabilities.
# See docs/COMMUNITY-PARTNER-OUTREACH.md

spec_version: "0.1"
registry: community_partners

outreach_policy:
  principle: >
    PoCP actively seeks partners in open-source and distributed communities —
    not token-first gatekeepers. Partnerships are Entity records with capabilities,
    trust alignment, and human outreach channels.
  status_flow:
    - prospect
    - outreach
    - in_conversation
    - active_partner
    - federation_peer
    - integrated
    - paused
    - declined

community_kinds:
  - oss_project
  - distributed_network
  - compute_collective
  - protocol_community
  - education_community
  - governance_community

partners:
  forgefed:
    display_name: ForgeFed Federation
    entity_id: pocp-entity-inspiration-forgefed
    inspiration_slug: forgefed
    community_kind: distributed_network
    portable_id: github:ForgeFed/ForgeFed
    github_url: https://github.com/ForgeFed/ForgeFed
    partnership_status: active_partner
    outreach_priority: high
    alignment: [no_token_first, portable_identity, federation]
    summary: >
      ActivityPub-based forge federation — natural fit for PoCP portable proof
      and multi-operator contribution networks.
    capabilities_offered:
      - capability: federation_import
        label: Cross-forge federation protocol
      - capability: agent_runtime
        label: Distributed project collaboration
    capabilities_sought:
      - capability: witness
        label: Verifiable contribution proofs on federated events
      - capability: llm_inference
        label: Advisory AI witness at edge nodes
    outreach:
      channel: github
      contact_url: https://github.com/ForgeFed/ForgeFed/discussions
      template_doc: docs/outreach/forgefed-proof-profile.md
      next_action: Propose PoCP proof packet as optional federation payload profile

  fediverse:
    display_name: Fediverse (ActivityPub)
    entity_id: pocp-entity-partner-fediverse
    community_kind: distributed_network
    portable_id: activitypub:core
    homepage_url: https://activitypub.rocks/
    partnership_status: prospect
    outreach_priority: high
    alignment: [no_token_first, distributed_community, openness]
    summary: Decentralized social graph — outreach for contribution visibility and portable reputation.
    capabilities_offered:
      - capability: federation_import
        label: Social graph distribution of public-good announcements
    capabilities_sought:
      - capability: witness
        label: Signed contribution attestations shareable as ActivityPub objects
    outreach:
      channel: fedi
      template_doc: docs/outreach/fediverse-contribution-note.md
      next_action: Draft ActivityPub Note type for PoCP contribution proof summaries

  ollama:
    display_name: Ollama Community
    entity_id: pocp-entity-partner-ollama
    community_kind: compute_collective
    portable_id: github:ollama/ollama
    github_url: https://github.com/ollama/ollama
    homepage_url: https://ollama.com
    partnership_status: in_conversation
    outreach_priority: high
    alignment: [local_first, no_token_first, compute_sharing]
    summary: Local LLM runtime — partner for distributed compute_profile adapters.
    capabilities_offered:
      - capability: llm_inference
        label: Local model inference on contributor hardware
      - capability: embeddings
        label: Embedding models for semantic matching
    capabilities_sought:
      - capability: witness
        label: ComputeReceipt attribution for shared inference
    outreach:
      channel: github
      contact_url: https://github.com/ollama/ollama/discussions
      template_doc: docs/outreach/ollama-compute-profile.md
      next_action: Publish PoCP compute_profile Ollama adapter spec in docs

  akash:
    display_name: Akash Network
    entity_id: pocp-entity-partner-akash
    inspiration_slug: akash
    community_kind: compute_collective
    portable_id: github:akash-network/node
    github_url: https://github.com/akash-network/node
    homepage_url: https://akash.network/
    partnership_status: prospect
    outreach_priority: medium
    alignment: [distributed_compute, adapter_only, no_token_first]
    summary: >
      Decentralized compute marketplace — candidate external Compute Entity source
      via COMPUTE-ADAPTER-SPEC (not PoCP GPU cloud).
    capabilities_offered:
      - capability: llm_inference
        label: Leased GPU/CPU deployments for inference jobs
      - capability: federation_import
        label: Provider manifests portable across PoCP nodes
    capabilities_sought:
      - capability: witness
        label: Contribution-bound ComputeReceipt on every job
    outreach:
      channel: github
      contact_url: https://github.com/akash-network/support/discussions
      template_doc: docs/COMPUTE-ADAPTER-SPEC.md
      next_action: Draft Akash manifest → compute_profile import stub

  render-network:
    display_name: Render Network
    entity_id: pocp-entity-partner-render
    inspiration_slug: render-network
    community_kind: compute_collective
    portable_id: web:rendernetwork.com
    homepage_url: https://rendernetwork.com/
    partnership_status: prospect
    outreach_priority: low
    alignment: [gpu_network, adapter_only, no_token_first]
    summary: GPU rendering and ML compute network — evaluate as GPU adapter, not settlement spine.
    capabilities_offered:
      - capability: llm_inference
        label: Distributed GPU for ML workloads
    capabilities_sought:
      - capability: witness
        label: Job receipts linked to contribution evidence
    outreach:
