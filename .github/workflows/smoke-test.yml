name: Smoke Test

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/smoke-test.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run repository health check
        working-directory: ..
        run: python backend/scripts/health_check.py

      - name: Start API
        env:
          DATABASE_URL: sqlite:///./data/pocp_ci.db
          POCP_WAIT_FOR_DB: "false"
          ENABLE_DEV_LOGIN: "true"
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health && break
            sleep 1
          done

      - name: Run unit tests
        id: pytest
        env:
          POCP_CRYPTO_SUITE: pocp-crypto-v0.2-hybrid
          POCP_NODE_PQC_PRIVATE_KEY: 50f1aad1c21870d89b32c33b75ad7666c313aca0ae8b20486ca5240a563de7c8
          POCP_NODE_PQC_PUBLIC_KEY: 26c3ea06eae3d672175add0f824e90f8ac3a5238f8ae44dced71130bfec21c21
        run: python -m pytest tests/ -q --tb=line

      - name: Run Phase A acceptance (single node)
        id: acceptance
        run: python scripts/run_phase_a_acceptance.py http://127.0.0.1:8765 --skip-optional
        continue-on-error: true

      - name: Report outcomes to Agent Studio
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          PYTEST_EXIT=${{ steps.pytest.outcome == 'success' && 0 || 1 }}
          ACC_EXIT=${{ steps.acceptance.outcome == 'success' && 0 || 1 }}
          python scripts/report_agent_studio_ci.py \
            --api http://127.0.0.1:8765 \
            --pytest-exit $PYTEST_EXIT \
            --acceptance-exit $ACC_EXIT \
            || true

      - name: Fail job if acceptance failed
        if: steps.acceptance.outcome != 'success'
        run: exit 1

      - name: Pilot metrics snapshot
        run: python scripts/pilot_metrics.py http://127.0.0.1:8765 --json > pilot-metrics.json

      - name: Upload pilot metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-metrics
          path: backend/pilot-metrics.json
          if-no-files-found: error
