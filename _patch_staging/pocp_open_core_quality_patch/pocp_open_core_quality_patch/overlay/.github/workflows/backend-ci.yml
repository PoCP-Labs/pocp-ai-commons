name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository health check
        run: |
          python backend/scripts/health_check.py

      - name: Install backend dependencies if available
        run: |
          if [ -f backend/requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r backend/requirements.txt
          fi

      - name: Lint with Ruff if available
        run: |
          python -m pip install ruff
          ruff check backend || true

      - name: Check formatting with Black if available
        run: |
          python -m pip install black
          black --check backend || true
